<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>バスの運転手さん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 明るく、やさしい。ボタンは大きく、1つずつ。
   IDEA: 路線バスの運転席。
   PICTURE: 3Dの町を運転席から見る。
   COLOUR and TYPE: バスの緑とクリーム、強調はオレンジ。BIZ UDPGothic。
   LAYOUT: 全画面3D＋上にお知らせ、下に大きなボタン。 */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:manipulation;
  font-family:'BIZ UDPGothic',sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
rt{font-size:.5em}
#hud{position:fixed;inset:0;pointer-events:none}
#hud .pe{pointer-events:auto}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#1f7a4d;color:#fff;
  border:4px solid #fff;border-radius:18px;padding:8px 26px;font-size:28px;font-weight:700;white-space:nowrap;
  box-shadow:0 6px 0 rgba(0,0,0,.25)}
#banner small{font-size:18px;opacity:.9;margin-right:8px}
#qBtn{position:absolute;top:12px;right:12px;width:60px;height:60px;border-radius:50%;border:4px solid #fff;
  background:#f39a1e;color:#fff;font-size:34px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#pax{position:absolute;top:12px;left:12px;background:rgba(255,253,240,.94);border-radius:16px;padding:8px 14px;
  font-size:18px;font-weight:700;color:#234;max-width:34vw;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#pax .icons{font-size:24px;letter-spacing:1px;line-height:1.2;margin-top:2px;min-height:28px}
#bell{position:absolute;top:96px;left:12px;padding:8px 14px;border-radius:14px;font-size:20px;font-weight:700;
  background:#5a2a2a;color:#a77;border:3px solid #333}
#bell.on{background:#e8322e;color:#fff;border-color:#fff;animation:blink .6s infinite alternate}
#door{position:absolute;top:150px;left:12px;padding:6px 12px;border-radius:12px;font-size:18px;font-weight:700;background:#2a9df4;color:#fff;display:none}
@keyframes blink{to{filter:brightness(1.35)}}
#action{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:22px}
.bigbtn{min-width:250px;min-height:100px;padding:16px 34px;border-radius:28px;border:5px solid #fff;color:#fff;
  font-size:36px;font-weight:700;box-shadow:0 9px 0 rgba(0,0,0,.28);animation:pulse 1s ease-in-out infinite;white-space:nowrap}
.bigbtn:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.28)}
@keyframes pulse{50%{transform:scale(1.07)}}
.b-open{background:#2a8fe0}.b-close{background:#ef7d1a}.b-go{background:#1fa95a}.b-chk{background:#7d55e6}
#pedals{display:none}
.pedal{position:absolute;bottom:22px;border:5px solid #fff;border-radius:22px;color:#fff;font-size:26px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.pedal .pic{font-size:44px;margin-bottom:6px}
#brake{left:22px;width:150px;height:200px;background:#d8392b}
#accel{right:22px;width:150px;height:200px;background:#2a8a3e}
.pedal.down{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.3);filter:brightness(1.2)}
#speed{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(10,20,30,.82);color:#7ff3a0;
  font-size:40px;font-weight:700;padding:6px 22px;border-radius:16px;display:none;white-space:nowrap}
#speed small{font-size:20px;color:#cde}
#gauge{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:min(520px,60vw);height:52px;display:none;
  background:rgba(255,255,255,.92);border-radius:26px;border:3px solid #234}
#gauge .zone{position:absolute;top:6px;bottom:6px;background:#9ee6a8;border-radius:8px}
#gauge .flag{position:absolute;top:-6px;font-size:36px;transform:translateX(-50%)}
#gauge .bus{position:absolute;top:4px;font-size:36px;transform:translateX(-80%) scaleX(-1)}
#gauge .dist{position:absolute;left:12px;top:12px;font-size:20px;font-weight:700;color:#234}
#warn{position:absolute;top:150px;left:50%;transform:translateX(-50%);background:#e8322e;color:#fff;font-size:30px;font-weight:700;
  padding:8px 24px;border-radius:16px;border:4px solid #fff;display:none;animation:blink .4s infinite alternate;white-space:nowrap}
#msg{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);background:rgba(255,253,240,.97);color:#234;
  font-size:40px;font-weight:700;padding:18px 36px;border-radius:24px;border:5px solid #f39a1e;opacity:0;transition:opacity .25s;
  white-space:nowrap;text-align:center}
#msg.show{opacity:1}
#ver{position:absolute;left:6px;bottom:2px;font-size:11px;color:rgba(255,255,255,.7)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#bfe8ff 0%,#e9f7ff 55%,#cdeccf 100%);padding:16px;overflow:hidden}
.ov.show{display:flex}
.ov.dim{background:rgba(10,30,40,.55)}
.panel{background:#fffdf3;border-radius:28px;border:5px solid #1f7a4d;padding:22px 30px;max-width:900px;width:100%;
  box-shadow:0 12px 0 rgba(0,0,0,.18);color:#213;text-align:center;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column}
/* 遊び方：説明だけをスクロールし、「はじめる」はいつも下に見えるようにする */
#howto .panel{overflow:hidden}
#howSteps{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 4px;width:100%}
#howto .row{flex:none;align-items:center}
#howto #startBtn{margin-top:10px}
@media (max-height:860px){
  .panel{padding:14px 22px}
  .panel h1{font-size:34px;margin:0 0 6px} .panel h2{font-size:28px;margin:0 0 6px}
  .steps{font-size:20px;line-height:1.45;gap:7px} .steps .st .ic{font-size:30px;min-width:42px}
  .card{min-height:84px} .card .ic{font-size:32px}
  .ov .bigbtn{min-height:78px;font-size:30px;padding:10px 28px}
}
.panel h1{margin:4px 0 12px;font-size:44px;color:#1f7a4d;line-height:1.3}
.panel h2{margin:4px 0 10px;font-size:34px;color:#1f7a4d}
.lab{font-size:22px;font-weight:700;margin:10px 0 6px;color:#456}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{min-width:120px;min-height:100px;border-radius:20px;border:4px solid #c9d6cc;background:#fff;padding:10px 14px;
  font-size:24px;color:#223;display:flex;flex-direction:column;align-items:center;gap:2px}
.card .ic{font-size:40px;line-height:1.1}
.card small{font-size:16px;color:#567}
.card.sel{border-color:#f39a1e;background:#fff2d6;box-shadow:0 0 0 4px #f39a1e55}
.mode .card{min-width:200px}
#wheelZone{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,48vw);height:36vh;display:none;touch-action:none}
#pedals.hard #wheelZone{display:block}
#wheelZone .hint{position:absolute;top:0;left:50%;transform:translateX(-50%);background:rgba(20,30,40,.7);color:#fff;font-size:20px;font-weight:700;padding:4px 16px;border-radius:14px;white-space:nowrap}
body.hardmode #speed{bottom:auto;top:84px;left:auto;right:12px;transform:none;font-size:32px}
#goBtn,#startBtn,.resBtn{margin-top:16px;animation:none}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left;font-size:24px;line-height:1.6;margin:6px auto;max-width:720px}
.steps .st{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:6px 14px;border:3px solid #dde8dd}
.steps .st .ic{font-size:38px;min-width:52px;text-align:center}
.mini{display:inline-block;color:#fff;border-radius:12px;padding:2px 10px;font-weight:700;font-size:20px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.sub{background:#fff;border:3px solid #9ab;color:#345;border-radius:16px;font-size:20px;min-height:52px;padding:6px 18px;font-weight:700}
.res-list{font-size:24px;line-height:1.7;margin:8px 0}
.big-n{font-size:64px;font-weight:700;color:#e8741a}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<!-- build: 2026-11-25b -->
<canvas id="c"></canvas>
<div id="hud">
  <div id="pax">おきゃくさん <span id="paxN">0</span><div class="icons" id="paxIcons"></div></div>
  <div id="bell">つぎ とまります</div>
  <div id="door">🚪 ドア あいてる</div>
  <div id="banner"><small>つぎは</small><span id="bannerName"></span></div>
  <button id="qBtn" class="pe" aria-label="あそびかた">？</button>
  <div id="gauge"><div class="zone"></div><div class="flag">🚏</div><div class="bus">🚌</div><div class="dist"></div></div>
  <div id="warn">🔴 あかしんごう！ とまろう</div>
  <div id="msg"></div>
  <div id="action" class="pe"></div>
  <div id="pedals">
    <div id="wheelZone" class="pe"><div class="hint">↺ ハンドルを まわそう ↻</div></div>
    <button id="brake" class="pedal pe"><span class="pic">🛑</span>ブレーキ</button>
    <button id="accel" class="pedal pe"><span class="pic">⬆️</span>アクセル</button>
  </div>
  <div id="speed"><span id="spd">0</span> <small>km/h</small></div>
  <div id="ver">v2026-11-25b</div>
</div>

<div id="title" class="ov show">
  <div class="panel">
    <h1>🚌 バスの <ruby>運転手<rt>うんてんしゅ</rt></ruby>さん</h1>
    <div class="lab">モードを えらぼう</div>
    <div class="cards mode" id="modeCards">
      <button class="card sel" data-mode="easy"><span class="ic">🟢</span><b>かんたん</b><small>ひかる ボタンを おすだけ</small></button>
      <button class="card" data-mode="normal"><span class="ic">🔵</span><b>ふつう</b><small>アクセルと ブレーキで うんてん</small></button>
      <button class="card" data-mode="hard"><span class="ic">🟠</span><b>ちょいむず</b><small>ハンドルも じぶんで</small></button>
    </div>
    <div class="lab">はしる みちを えらぼう</div>
    <div class="cards" id="themeCards"></div>
    <button id="goBtn" class="bigbtn b-go">つぎへ ▶</button>
  </div>
</div>

<div id="howto" class="ov">
  <div class="panel">
    <h2>あそびかた</h2>
    <div class="steps" id="howSteps"></div>
    <div class="row">
      <button id="toMenu" class="sub" style="display:none">さいしょの がめんへ</button>
      <button id="startBtn" class="bigbtn b-go">はじめる ▶</button>
    </div>
  </div>
</div>

<div id="result" class="ov">
  <div class="panel">
    <h1>🎉 おつかれさまでした！</h1>
    <div id="resBody"></div>
    <div class="row">
      <button id="againBtn" class="bigbtn b-go resBtn">もういちど</button>
      <button id="menuBtn" class="bigbtn b-open resBtn">みちを かえる</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

// ================= 調整値 =================
const CFG = {
  version: 'v2026-11-25b',
  stops: 2,            // バス停の数（最後が終点）
  stopGap: 170,        // バス停の間隔 m
  startPad: 30,        // スタートから最初のバス停までの余白（stopGapに足す）
  endPad: 140,
  signals: 2,          // 信号の数
  roadHalf: 4.2,       // 道路の半分の幅
  walk: 2.6,           // 歩道の幅
  laneOff: 2.0,        // バスが走る車線の中心（左が＋）
  camH: 2.55, camSide: 0.75, lookAhead: 14, fov: 62,
  // かんたん（自動運転）
  easySpeed: 11, easyAccel: 1.8, easyDecel: 2.2,
  // ふつう
  maxSpeed: 13.9, accel: 2.3, coast: 0.45,
  brakeMin: 2.0, brakeMax: 6.0, brakeRamp: 1.5, // 押し続けるほど強くなる
  hardDecel: 5.5, hardSpeed: 8.0,               // 急ブレーキ判定
  // ちょいむず（ハンドル操作）
  steerK: 0.032,      // ハンドルいっぱいで曲がる強さ（1/m）
  steerMaxDeg: 120,   // ハンドルを回せる角度（左右それぞれ）
  steerReturn: 150,   // 手を離したとき ハンドルが まっすぐに戻る速さ（度/秒）
  psiDamp: 1.2,       // 向きのずれが自然に戻る強さ（遊びやすさのためのチート）
  warnLat: 0.85,      // 車線の中心からこれ以上ずれたら注意
  curbLat: 1.05, centerLat: -1.1, // 歩道側にぶつかる位置／センターラインをはみ出す位置
  starTol: [1.5, 4.0],  // ⭐3 / ⭐2 のずれ許容 m
  zoneBack: 14, zoneOver: 6,
  announceDist: 95,
  redChance: 0.75, redWait: 3.0, yellowTime: 1.6,
  maxWaiting: 3,
  walkSpeed: 1.7,
  voice: true,          // アナウンスの読み上げ
};

// ================= iPad対策 =================
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
document.addEventListener('touchmove', e => {
  // 説明画面など、中身があふれてスクロールできる所だけはスクロールを許す
  for (let el = e.target; el && el !== document.body; el = el.parentElement) {
    if (el.scrollHeight > el.clientHeight + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowY)) return;
  }
  e.preventDefault();
}, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

// ================= 乱数 =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rand = mulberry32(Date.now() % 1e9);
const rr = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(rand() * a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ================= 路線の雰囲気 =================
const THEMES = {
  town: { label:'まちなか', icon:'🏙️', sky:0x9fd4ff, fog:[70,230], ground:0x8d9b80, walk:0xc8c2b6, curve:0.004,
    line:'まちなか せん',
    names:['えきまえ','しやくしょまえ','としょかんまえ','びょういんまえ','ゆうびんきょくまえ','しょうてんがい','スーパーまえ','こうばんまえ','ぶんかセンター','ほんやさんまえ'] },
  sea: { label:'うみぞい', icon:'🌊', sky:0x86d4ff, fog:[80,260], ground:0x9cc46e, walk:0xe6d6a4, curve:0.0035,
    line:'うみぞい せん',
    names:['みなと','うみのえき','すいぞくかんまえ','かいがんどおり','とうだいまえ','ヨットハーバー','つりばまえ','すなはまこうえん'] },
  mountain: { label:'やまみち', icon:'⛰️', sky:0xb2ddf3, fog:[60,220], ground:0x5f9a48, walk:0x9e8c6c, curve:0.010,
    line:'やまみち せん',
    names:['もりのいりぐち','たきまえ','おんせんまえ','キャンプじょう','てんぼうだい','ぼくじょうまえ','つりばし','やまのうえ'] },
};
const THEME_KEYS = Object.keys(THEMES);
// 読み上げ用のことば（画面はひらがな、音声は漢字まじり）
// iPadの読み上げは ひらがなだけの文だと「っ」「ゃ」などの小さい字を うまく読めないことがあるため、
// 音声には漢字まじりの文を渡す。
const YOMI = {
  'えきまえ':'駅前','しやくしょまえ':'市役所前','としょかんまえ':'図書館前','びょういんまえ':'病院前','ゆうびんきょくまえ':'郵便局前',
  'しょうてんがい':'商店街','スーパーまえ':'スーパー前','こうばんまえ':'交番前','ぶんかセンター':'文化センター','ほんやさんまえ':'本屋さん前',
  'みなと':'港','うみのえき':'海の駅','すいぞくかんまえ':'水族館前','かいがんどおり':'海岸通り','とうだいまえ':'灯台前',
  'ヨットハーバー':'ヨットハーバー','つりばまえ':'つりば前','すなはまこうえん':'砂浜公園',
  'もりのいりぐち':'森の入り口','たきまえ':'たき前','おんせんまえ':'温泉前','キャンプじょう':'キャンプ場','てんぼうだい':'展望台',
  'ぼくじょうまえ':'牧場前','つりばし':'吊り橋','やまのうえ':'山の上',
  'まちなか せん':'まちなか線','うみぞい せん':'海沿い線','やまみち せん':'山道線',
};
const yomi = t => YOMI[t] || t;

// ================= three 基本 =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CFG.fov, innerWidth / innerHeight, 0.05, 450);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(60, 100, 30); scene.add(sun);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---- Canvasテクスチャ ----
function cvs(w, h, draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
const roadTex = cvs(256, 256, (g, w, h) => {
  g.fillStyle = '#5b5f63'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},255,.05)`; g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  g.fillStyle = '#f4f4f0'; g.fillRect(8, 0, 6, h); g.fillRect(w - 14, 0, 6, h);
  g.fillRect(w / 2 - 4, 0, 8, h * 0.55);
});
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
const crossTex = cvs(256, 32, (g, w, h) => { g.clearRect(0,0,w,h); g.fillStyle='#f6f6f2'; const n=8; for(let i=0;i<n;i++) g.fillRect(i*w/n+4, 0, w/n*0.55, h); });
const busPaintTex = cvs(256, 128, (g, w, h) => { g.clearRect(0,0,w,h); g.fillStyle='#ffd23a'; g.font='bold 96px "BIZ UDPGothic",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('バス', w/2, h/2+4); });
const winTex = cvs(64, 128, (g, w, h) => { g.fillStyle='#ffffff'; g.fillRect(0,0,w,h); g.fillStyle='#4a6a8a'; for(let y=8;y<h-6;y+=20) for(let x=6;x<w-6;x+=15) g.fillRect(x,y,9,12); });
function signTex(name){
  return cvs(256, 384, (g, w, h) => {
    g.clearRect(0,0,w,h);
    g.fillStyle='#fff'; g.beginPath(); g.arc(w/2, 120, 112, 0, Math.PI*2); g.fill();
    g.lineWidth=14; g.strokeStyle='#1f7a4d'; g.stroke();
    g.fillStyle='#1f7a4d'; g.font='bold 84px "BIZ UDPGothic",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('バス', w/2, 124);
    g.fillStyle='#1f7a4d'; g.fillRect(8, 250, w-16, 120); g.fillStyle='#fff';
    let fs = 54; g.font=`bold ${fs}px "BIZ UDPGothic",sans-serif`;

// ================= 路線 =================
const Route = { n:0, L:0, X:null, Z:null, H:null, stopS:[], sigS:[] };
function pt(s, lat = 0){
  const { X, Z, H, n } = Route; let x, z, h;
  if (s <= 0) { h = H[0]; x = X[0] + Math.sin(h)*s; z = Z[0] + Math.cos(h)*s; }
  else if (s >= n - 1) { const i = n - 1, e = s - i; h = H[i]; x = X[i] + Math.sin(h)*e; z = Z[i] + Math.cos(h)*e; }
  else { const i = Math.floor(s), t = s - i; x = X[i] + (X[i+1]-X[i])*t; z = Z[i] + (Z[i+1]-Z[i])*t; h = H[i] + (H[i+1]-H[i])*t; }
  return [x + Math.cos(h)*lat, z - Math.sin(h)*lat, h]; // lat>0 は進行方向の左
}
function buildRoute(T){
  const stopS = []; for (let i = 0; i < CFG.stops; i++) stopS.push(CFG.startPad + CFG.stopGap*(i+1));
  const L = stopS[stopS.length-1] + CFG.endPad;
  const gaps = shuffle([...Array(CFG.stops-1)].map((_, i) => i + 1)).slice(0, CFG.signals);
  const sigS = gaps.map(i => Math.round((stopS[i-1] + stopS[i]) / 2)).sort((a, b) => a - b);
  const keys = [...stopS, ...sigS];
  const n = Math.ceil(L) + 1;
  const X = new Float32Array(n), Z = new Float32Array(n), H = new Float32Array(n);
  let x = 0, z = 0, h = 0; const p1 = rand()*6.283, p2 = rand()*6.283;
  for (let i = 0; i < n; i++) {
    X[i] = x; Z[i] = z; H[i] = h;
    let d = 1e9; for (const k of keys) d = Math.min(d, Math.abs(i - k));
    const mask = Math.min(1, Math.max(0, (d - 22) / 30)) * (i < 40 ? 0 : 1);
    h += T.curve * (Math.sin(i*0.012 + p1) + 0.7*Math.sin(i*0.027 + p2)) * mask;
    x += Math.sin(h); z += Math.cos(h);
  }
  Object.assign(Route, { n, L, X, Z, H, stopS, sigS });
}
function nearRoad(x, z, clear){
  const c2 = clear*clear;
  for (let i = 0; i < Route.n; i += 3) { const dx = Route.X[i]-x, dz = Route.Z[i]-z; if (dx*dx+dz*dz < c2) return true; }
  return false;
}
const nearKey = (s, list, d) => list.some(k => Math.abs(k - s) < d);

// 道にそった帯
function ribbon(lat0, lat1, y, mat, vScale = 10, s0 = -40, s1 = Route.n + 20, step = 2){
  const pos = [], uv = [], idx = []; let k = 0;
  for (let s = s0; ; s += step) {
    const ss = Math.min(s, s1); const a = pt(ss, lat0), b = pt(ss, lat1);
    pos.push(a[0], y, a[1], b[0], y, b[1]); uv.push(0, ss/vScale, 1, ss/vScale);
    if (k > 0) { const i = k*2; idx.push(i-2, i-1, i, i-1, i+1, i); }
    k++; if (ss >= s1) break;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  mat.side = THREE.DoubleSide; const m = new THREE.Mesh(g, mat); world.add(m); return m;
}
// 短い四角（路面表示など）
function quad(s0, s1, latL, latR, y, mat){
  const a = pt(s0, latL), b = pt(s0, latR), c = pt(s1, latL), d = pt(s1, latR);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([a[0],y,a[1], b[0],y,b[1], c[0],y,c[1], d[0],y,d[1]], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 1,0, 0,1, 1,1], 2));
  g.setIndex([0,1,2, 1,3,2]); g.computeVertexNormals();
  mat.side = THREE.DoubleSide; const m = new THREE.Mesh(g, mat); world.add(m); return m;
}
function inst(geo, mat, list){
  if (!list.length) return;
  const m = new THREE.InstancedMesh(geo, mat, list.length), o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((p, i) => {
    o.position.set(p.x, p.y || 0, p.z); o.rotation.set(0, p.ry || 0, 0); o.scale.set(p.sx, p.sy, p.sz); o.updateMatrix();
    m.setMatrixAt(i, o.matrix); if (p.color != null) { c.set(p.color); m.setColorAt(i, c); }
  });
  m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true;
  world.add(m);
}

let AC = null, master = null, eng = null;
function initAudio(){
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
      const o = AC.createOscillator(); o.type = 'sawtooth'; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260;
      const g = AC.createGain(); g.gain.value = 0; o.connect(f); f.connect(g); g.connect(master); o.start(); eng = { o, g };
    }
    AC.resume();
  } catch (e) {}
}
function tone(freq, t0, dur, type = 'sine', vol = 0.25){
  if (!AC) return; const t = AC.currentTime + t0;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}

  coin(){ tone(2093, 0, 0.15, 'triangle', 0.2); tone(2637, 0.08, 0.3, 'triangle', 0.18); },

  bad(){ tone(330, 0, 0.25, 'square', 0.1); tone(262, 0.22, 0.35, 'square', 0.1); },
  winker(){ for (let i = 0; i < 6; i++) { tone(1400, i*0.32, 0.03, 'square', 0.08); tone(900, i*0.32 + 0.16, 0.03, 'square', 0.06); } },
  pshh(){
    if (!AC) return; const len = 0.7, b = AC.createBuffer(1, AC.sampleRate*len, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/d.length, 1.5);
    const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.7;
    const g = AC.createGain(); g.gain.value = 0.5; s.connect(f); f.connect(g); g.connect(master); s.start();
  },
};

function decideOff(st){
  if (st.decided) return; st.decided = true;
  if (st.last) { st.off = G.aboard; }
  else {
    st.off = Math.min(G.aboard, ri(0, 2));
    if (st.waiting.length === 0 && G.aboard > 0 && st.off === 0) st.off = 1;
  }
}
function arrive(diff){
  const st = curStop(); G.bus.v = 0; G.atStop = true; decideOff(st);
  if (G.mode !== 'easy') {

    let star = a <= CFG.starTol[0] ? 3 : a <= CFG.starTol[1] ? 2 : 1;
    if (st.over) star = Math.min(star, 2);
    st.star = star; SFX.star();
    showMsg('⭐'.repeat(star) + '<br>' + (star === 3 ? 'ぴったり！' : star === 2 ? 'じょうず！' : 'とまれたね！'), 2.2);
  } else { SFX.star(); showMsg('🚏 とうちゃく！', 1.6); }

}
function startBoarding(){

  G.offQ = st.off; G.onQ = st.waiting.slice(); st.waiting = []; G.bt = 0.3; G.walkers = 0; G.thanked = false;
  st.bellOn = false; G.door = true; setState('boarding');
  showMsg('🚪 どうぞ', 1.4); G.bt = 1.3; // ドアが開いたら「どうぞ」を見せてから乗り降りを始める
}
const doorPos = () => pt(G.bus.s - 1.0, CFG.laneOff + G.lat + 1.35);
function spawnOff(){
  const p = makePerson(rand() < 0.3); const [x, z] = doorPos(); p.position.set(x, 0, z);
  const [tx, tz] = pt(G.bus.s - 1.0, CFG.roadHalf + CFG.walk - 0.6);
  G.actors.push({ p, mode: 'leave', tx, tz, t: 0, phase: 0 });

}
function walkTo(a, dt, speed){
  const dx = a.tx - a.p.position.x, dz = a.tz - a.p.position.z, d = Math.hypot(dx, dz);
  if (d < 0.15) return true;
  const m = Math.min(d, speed*dt); a.p.position.x += dx/d*m; a.p.position.z += dz/d*m;
  a.p.rotation.y = Math.atan2(dx, dz); a.p.position.y = Math.abs(Math.sin(a.t*10))*0.06; return false;
}
function updateActors(dt){
  for (let i = G.actors.length - 1; i >= 0; i--) {
    const a = G.actors[i]; a.t += dt;

      const [dx, dz] = doorPos(); a.tx = dx; a.tz = dz;
      if (walkTo(a, dt, CFG.walkSpeed)) {
        world.remove(a.p); G.actors.splice(i, 1); G.walkers--; G.aboard++; G.carried++; updatePax(); SFX.coin();
      }
    } else if (a.mode === 'leave') {
      if (walkTo(a, dt, CFG.walkSpeed) && a.phase === 0) { a.phase = 1; const [tx, tz] = pt(G.bus.s - 8 - rr(0, 6), CFG.roadHalf + CFG.walk + 3); a.tx = tx; a.tz = tz; }

    }

  if (st && st.waiting.length && st.s - G.bus.s < 50) st.waiting.forEach((p, k) => { p.position.y = 0.1 + Math.max(0, Math.sin(G.elapsed*6 + k))*0.12; });
}
function updateSignals(dt, prevS){

    if (!sig.trig && d < 75 && d > 20) { sig.trig = true; if (rand() < CFG.redChance) { setLight(sig, 'yellow'); sig.t = 0; } }
    if (sig.state === 'yellow') { sig.t += dt; if (sig.t > CFG.yellowTime) { setLight(sig, 'red'); sig.wait = 0; } }
    else if (sig.state === 'red') {

    }

        G.sigViol++; SFX.bad(); showMsg('🔴 あかしんごう！<br>もどって やりなおそう', 2.6);
        G.bus.s = sig.s - 40; G.bus.v = 0; G.pedal.bHold = 0; G.psi = 0; sig.wait = 0;

function nextRed(){ for (const s of G.sigs) if (s.state !== 'green' && s.s > G.bus.s - 0.05) return s; return null; }
function driveUpdate(dt){
  const st = curStop(), bus = G.bus;

    st.announced = true; decideOff(st); SFX.chime();
    G.timers.push({ t: 0.9, fn: () => say((st.last ? '次は、終点、' : '次は、') + yomi(st.name) + ' です') });
    if (st.off > 0) G.timers.push({ t: 3.4, fn: () => { if (!st.done) { st.bellOn = true; SFX.bell(); say('次、止まります'); } } });

    const dist = target - bus.s;
    const vt = Math.min(CFG.easySpeed, Math.sqrt(2*CFG.easyDecel*Math.max(0, dist)));
    bus.v = bus.v < vt ? Math.min(vt, bus.v + CFG.easyAccel*dt) : Math.max(vt, bus.v - 4*dt);

  }
  const red = nextRed();
  $('warn').style.display = (G.mode !== 'easy' && G.state === 'drive' && red && red.s - G.bus.s < 50 && G.bus.v > 0.3) ? 'block' : 'none';
  if (eng && AC) {
    const run = !G.paused && !['menu','result'].includes(G.state);
    eng.g.gain.setTargetAtTime(run ? 0.035 + G.bus.v*0.004 : 0, AC.currentTime, 0.1);
    eng.o.frequency.setTargetAtTime(42 + G.bus.v*5, AC.currentTime, 0.1);
  }
}
function update(dt){
  if (G.paused || G.state === 'menu' || G.state === 'result') return;
  G.frames++; G.elapsed += dt;
  for (let i = G.timers.length - 1; i >= 0; i--) { const t = G.timers[i]; t.t -= dt; if (t.t <= 0) { G.timers.splice(i, 1); t.fn(); } }
  const prevS = G.bus.s;
  if (G.state === 'drive') driveUpdate(dt); else G.bus.v = 0;
  updateSignals(dt, prevS);
  serviceUpdate(dt);
  updateActors(dt);
  updateCars(dt);
  updateCamera(dt);
  updateHUD(dt);
}

// ================= 画面の切りかえ =================
const themeCards = $('themeCards');
themeCards.innerHTML = THEME_KEYS.map(k => `<button class="card${k === G.themeChoice ? ' sel' : ''}" data-theme="${k}"><span class="ic">${THEMES[k].icon}</span>${THEMES[k].label}</button>`).join('')
  + `<button class="card" data-theme="random"><span class="ic">🎲</span>おまかせ</button>`;
onTap(themeCards, e => { const b = e.target.closest('[data-theme]'); if (!b) return; G.themeChoice = b.dataset.theme; themeCards.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c === b)); });
onTap($('modeCards'), e => { const b = e.target.closest('[data-mode]'); if (!b) return; G.mode = b.dataset.mode; $('modeCards').querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c === b)); });

function howtoHTML(){
  const m = (cls, t) => `<span class="mini ${cls}">${t}</span>`;
  if (G.mode === 'easy') return [
    ['🚌', 'バスは じどうで はしるよ。バスていに つくと とまるよ。'],
    ['👆', 'ひかっている ボタンを おそう。<br>' + m('b-open','🚪あける') + ' → ' + m('b-close','🚪しめる') + ' → ' + m('b-go','しゅっぱつ▶')],
    ['🙂', 'おきゃくさんを のせて、<ruby>終点<rt>しゅうてん</rt></ruby>まで はこぼう！'],
  ].map(([i, t]) => `<div class="st"><span>${t}</span></div>`).join(''); // 左のアイコンは表示しない
  return [
    ['🦶', m('b-go" style="background:#2a8a3e','⬆️アクセル') + ' で すすむ。' + m('b-go" style="background:#d8392b','🛑ブレーキ') + ' で とまる。<br>ブレーキは ずっと つよく ふむと、おきゃくさんが よろけるよ。'],
    ...(G.mode === 'hard' ? [['🛞', 'ハンドルに さわって くるっと まわそう。<br>カーブでは まがる ほうへ まわしてね。てを はなすと まっすぐに もどるよ。ひだりの しゃせんから はみださないように！']] : []),
    ['🚏', 'バスていの きいろい せんに ぴったり とめよう。⭐⭐⭐'],
    ['🔴', 'あかしんごうでは とまろう。'],
    ['👆', 'とまったら ' + m('b-open','🚪あける') + ' → ' + m('b-close','🚪しめる') + ' → ' + m('b-chk','👉みぎよし') + m('b-chk','👈ひだりよし') + ' → ' + m('b-go','しゅっぱつ▶')],
  ].map(([i, t]) => `<div class="st"><span>${t}</span></div>`).join(''); // 左のアイコンは表示しない
}
function openHowto(midGame){
  $('howSteps').innerHTML = howtoHTML();
  $('startBtn').textContent = midGame ? 'つづける ▶' : 'はじめる ▶';
  $('toMenu').style.display = midGame ? 'inline-block' : 'none';
  $('howto').classList.add('show'); $('howto').classList.toggle('dim', midGame);
  if (midGame) { G.paused = true; try { speechSynthesis.cancel(); } catch (e) {} }
}
onTap($('goBtn'), () => { initAudio(); $('title').classList.remove('show'); newGame(); openHowto(false); });
onTap($('startBtn'), () => {
  initAudio(); if (CFG.voice && window.speechSynthesis) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
  $('howto').classList.remove('show'); G.paused = false;
  if (G.state === 'ready' && G.frames === 0) { say(yomi(THEMES[G.theme].line) + '、出発します'); showMsg(THEMES[G.theme].icon + ' ' + THEMES[G.theme].line, 1.8); }
});
onTap($('qBtn'), () => { if (G.state !== 'menu' && G.state !== 'result' && !$('howto').classList.contains('show')) openHowto(true); });
onTap($('toMenu'), () => { $('howto').classList.remove('show'); toMenu(); });
onTap($('againBtn'), () => { $('result').classList.remove('show'); newGame(); openHowto(false); });
onTap($('menuBtn'), () => { $('result').classList.remove('show'); toMenu(); });
function toMenu(){ G.paused = false; G.state = 'menu'; renderActions(); $('title').classList.add('show'); try { speechSynthesis.cancel(); } catch (e) {} }

function newGame(seed){
  if (seed != null) rand = mulberry32(seed);
  G.theme = G.themeChoice === 'random' ? pick(THEME_KEYS) : G.themeChoice;
  buildWorld();
  Object.assign(G, { bus:{ s:10, v:0 }, ns:0, atStop:false, aboard:0, carried:0, hardBrakes:0, sigViol:0, timers:[], frames:0, elapsed:0, shake:0, door:false, paused:false, look:0 });
  G.pedal = { a:false, b:false, bHold:0, hardDone:false };
  Object.assign(G, { lat:0, psi:0, steer:0, steerDeg:0, wheelHeld:false, outs:0, outFlag:false });
  cockpit.userData.wheel.visible = G.mode !== 'hard'; cockpit.userData.hard.visible = G.mode === 'hard';
  document.body.classList.toggle('hardmode', G.mode === 'hard');
  updatePax(); updateBanner(); setState('ready'); updateCamera(0); updateHUD(0);
}
// 人数のよみかた：1→ひとり、2→ふたり、3いじょうは「〇にん」
function ninzu(n){ return n === 1 ? 'ひとり' : n === 2 ? 'ふたり' : n + 'にん'; }
function showResult(){
  setState('result');
  let h = `<div class="res-list">のせた おきゃくさん</div><div class="big-n">🙂 ${ninzu(G.carried)}</div>`;
  if (G.mode !== 'easy') {
    const tot = G.stops.reduce((a, s) => a + s.star, 0);
    h += `<div class="res-list">` + G.stops.map(s => `${s.name}　${'⭐'.repeat(s.star)}`).join('<br>') + `</div>`;
    h += `<div class="res-list">ほし ぜんぶで <b>${tot}</b> こ / ${G.stops.length*3}こ</div>`;
    if (G.mode === 'hard') h += `<div class="res-list">${G.outs === 0 ? '✅ しゃせんを まもれた' : '🔸 はみだし ' + G.outs + 'かい'}</div>`;
    h += `<div class="res-list">${G.hardBrakes === 0 ? '✅ やさしい ブレーキ' : '🔸 きゅうブレーキ ' + G.hardBrakes + 'かい'}　${G.sigViol === 0 ? '✅ しんごうを まもれた' : '🔸 あかしんごう ' + G.sigViol + 'かい'}</div>`;
  } else {
    h += `<div class="res-list">ぜんぶの バスていに とまれたね！<br>${THEMES[G.theme].icon} ${THEMES[G.theme].line}</div>`;
  }
  $('resBody').innerHTML = h; $('result').classList.add('show'); SFX.star();
}

// ================= ループ =================
let last = performance.now(), manual = false;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  if (!manual) update(dt);
  renderer.render(scene, camera);
}
newGame(); G.state = 'menu'; renderActions();
requestAnimationFrame(loop);

// ================= テスト用フック =================
// バスは .position ではなく G.bus.s（道にそった距離 m）で動かしている。カメラは毎フレーム s から計算。
window.__game = {
  G, camera, scene, CFG,
  get state(){ return G.state; },
  api: {
    start(mode = 'easy', theme = 'town', seed = 1){ G.mode = mode; G.themeChoice = theme; $('title').classList.remove('show'); $('howto').classList.remove('show'); $('result').classList.remove('show'); newGame(seed); },
    setManual(v){ manual = v; },
    tick(n = 1, dt = 1/60, render = true){ for (let i = 0; i < n; i++) update(dt); if (render) renderer.render(scene, camera); },
    press(a){ act(a); },
    pedal(a, b){ G.pedal.a = !!a; G.pedal.b = !!b; },
    steer(u){ G.wheelHeld = true; G.steerDeg = Math.max(-1, Math.min(1, u))*CFG.steerMaxDeg; }, // u: -1(右)〜1(左)
    get(){ return { state:G.state, s:G.bus.s, v:G.bus.v, ns:G.ns, aboard:G.aboard, carried:G.carried, theme:G.theme, frames:G.frames, elapsed:G.elapsed,
      stops:G.stops.map(s => ({ s:s.s, name:s.name, star:s.star, waiting:s.waiting.length })), sigs:G.sigs.map(s => ({ s:s.s, state:s.state })), hard:G.hardBrakes, viol:G.sigViol, lat:G.lat, psi:G.psi, outs:G.outs }; },
  },
};
</script>
</body>
